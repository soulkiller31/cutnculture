services:

  # ── Backend: Node.js + WhatsApp ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend
    restart: on-failure:5
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
      WHATSAPP_SESSION_PATH: /app/.wwebjs_auth
    volumes:
      - whatsapp_session:/app/.wwebjs_auth
      - whatsapp_cache:/app/.wwebjs_cache
      - pup_cache:/app/.cache
    expose:
      - "5000"
    networks:
      - crm-net

  # ── Frontend builder: builds React and populates the shared volume ────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-frontend-build
    volumes:
      - frontend_dist:/app/dist
    # Exits after copying — that's intentional
    restart: "no"
    networks:
      - crm-net

  # ── Nginx: serves React static files + proxies /api to backend ────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - crm-net

  # ── Certbot: auto SSL renewal ─────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: crm-certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  frontend_dist:
  whatsapp_session:
  whatsapp_cache:
  pup_cache:
  certbot_certs:
  certbot_www:

networks:
  crm-net:
    driver: bridge
