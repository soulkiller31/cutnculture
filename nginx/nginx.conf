upstream backend {
    server backend:5000;
    # If backend is down, return 503 instead of 502
    keepalive 16;
}

# ── HTTP ──────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name cutnculturesalon.cloud www.cutnculturesalon.cloud 89.116.134.239;

    # Certbot SSL challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    # React SPA — serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api → backend Node.js
    location /api {
        proxy_pass             http://backend;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        'upgrade';
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_cache_bypass     $http_upgrade;
        proxy_read_timeout     120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     120s;
        client_max_body_size   50M;

        # Return 503 with friendly message if backend is not ready yet
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"success":false,"message":"Backend is starting up, please wait 30 seconds and try again."}';
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
}

