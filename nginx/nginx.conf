upstream backend {
    server backend:5000;
}

# ── HTTP — serve app + handle Certbot challenge ───────────────────────────────
server {
    listen 80;
    server_name cutnculturesalon.cloud www.cutnculturesalon.cloud 89.116.134.239;

    # Certbot SSL challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Once SSL is active, uncomment the line below and remove the rest of this block
    # return 301 https://cutnculturesalon.cloud$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        client_max_body_size  50M;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
}

